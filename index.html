<!DOCTYPE html>
<html lang="pl">
<head>

        /* --- SKALOWANIE ZAWARTOŚCI (75%) --- */
        html {
            /* Zmniejszamy bazę, co pomniejszy wszystkie elementy na stronie */

                /* Na telefonach przywracamy 100% wielkości dla czytelności */

        .font-brand {

        }

        /* Upewniamy się, że kontener aplikacji wypełnia całą szerokość dla teł */
        #root {

        }
